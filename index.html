<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Starry Night for Kris 🌌</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030712;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* O canvas onde as estrelas e a arte se formam */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Elementos de texto flutuantes no topo e embaixo */
        .header-content {
            position: relative;
            z-index: 2;
            margin-top: 30px;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            color: #facc15;
            font-size: 1.6rem;
            margin: 0;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.6);
            letter-spacing: 2px;
        }

        .footer-content {
            position: relative;
            z-index: 2;
            margin-bottom: 35px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        p.quote {
            color: #38bdf8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            background: rgba(3, 7, 18, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* Botão interativo futurista */
        .btn-surprise {
            background: linear-gradient(135deg, #facc15, #d97706);
            color: #030712;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.4);
            transition: transform 0.2s;
            pointer-events: auto;
        }
        .btn-surprise:active { transform: scale(0.95); }

        /* Modal Secreta */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .modal-box {
            background: #0f172a;
            border: 2px solid #facc15;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.3);
        }
        .modal-box p {
            color: #f8fafc;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #facc15;
            color: #030712;
            border: none;
            padding: 8px 20px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <canvas id="starryCanvas"></canvas>

    <div class="header-content">
        <h1>FOR KRIS 🌌</h1>
    </div>

    <div class="footer-content">
        <p class="quote">"May the stars light up your path wherever you go." ✨</p>
        <button class="btn-surprise" onclick="openModal()">Click for a secret 💫</button>
    </div>

    <!-- Modal Secreta -->
    <div id="secretModal" class="modal">
        <div class="modal-box">
            <p>They say stars shine brighter when you're around the right person... 💫<br><br>*(Compiled specially for you!)*</p>
            <button class="close-btn" onclick="closeModal()">Close 💙</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('starryCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Paleta de cores de Van Gogh (azuis profundos, dourados e amarelos estelares)
        const colors = ['#1d4ed8', '#3b82f6', '#0284c7', '#facc15', '#f59e0b', '#fbbf24', '#ffffff'];

        // Criar partículas que voam e formam o efeito
        let particles = [];
        const numParticles = window.innerWidth < 600 ? 120 : 250;

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.size = Math.random() * 2.5 + 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.8 + 0.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Efeito de redemoinho suave estilo Van Gogh
                this.vx += Math.sin(this.y * 0.01) * 0.02;
                this.vy += Math.cos(this.x * 0.01) * 0.02;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.15)'; // Rastro suave de movimento
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Funções da Modal
        function openModal() {
            document.getElementById('secretModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('secretManager' || 'secretModal').style.display = 'none';
        }
    </script>

</body>
</html>
