<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Starry Night for Kris 🌌</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #020617 0%, #0c1c38 50%, #050b18 100%);
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
            margin-top: 35px;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            color: #facc15;
            font-size: 1.8rem;
            margin: 0;
            text-shadow: 0 0 20px rgba(250, 204, 21, 0.8), 0 0 10px rgba(245, 158, 11, 0.5);
            letter-spacing: 3px;
        }

        .footer-content {
            position: relative;
            z-index: 2;
            margin-bottom: 35px;
            text-align: center;
            width: 85%;
            max-width: 400px;
        }

        p.quote {
            color: #e2e8f0;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            background: rgba(8, 15, 30, 0.85);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid rgba(250, 204, 21, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .btn-surprise {
            background: linear-gradient(135deg, #facc15, #d97706);
            color: #030712;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.5);
            transition: transform 0.2s;
            pointer-events: auto;
        }
        .btn-surprise:active { transform: scale(0.95); }

        /* Modal Secreta com ID corrigido para fechar direito */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .modal-box {
            background: #0f172a;
            border: 2px solid #facc15;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            max-width: 320px;
            box-shadow: 0 0 40px rgba(250, 204, 21, 0.4);
        }
        .modal-box p {
            color: #f8fafc;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #facc15;
            color: #030712;
            border: none;
            padding: 10px 22px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.3);
        }
    </style>
</head>
<body>

    <canvas id="vanGoghCanvas"></canvas>

    <div class="header-content">
        <h1>FOR KRIS 🌌</h1>
    </div>

    <div class="footer-content">
        <p class="quote">"May the stars light up your path wherever you go." ✨</p>
        <button class="btn-surprise" onclick="openModal()">Click for a secret 💫</button>
    </div>

    <!-- Modal Secreta -->
    <div id="secretModal" class="modal">
        <div class="modal-box">
            <p>They say stars shine brighter when you're around the right person... 💫<br><br>*(Compiled specially for you!)*</p>
            <button class="close-btn" onclick="closeModal()">Close 💙</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('vanGoghCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let angle = 0;

        function drawStarryNight() {
            ctx.fillStyle = 'rgba(2, 6, 23, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ondas imitando as pinceladas azuis de Van Gogh
            ctx.lineWidth = 4;
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.strokeStyle = i % 2 === 0 ? 'rgba(29, 78, 216, 0.35)' : 'rgba(14, 116, 144, 0.3)';
                let yOffset = (canvas.height / 6) * i;
                for (let x = 0; x < canvas.width; x += 15) {
                    let y = yOffset + Math.sin(x * 0.012 + angle + i) * 50;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // Estrelas grandes e brilhantes com o formato e halo da pintura original
            const stars = [
                { x: canvas.width * 0.2,  y: canvas.height * 0.22, size: 32 },
                { x: canvas.width * 0.8,  y: canvas.height * 0.30, size: 42 },
                { x: canvas.width * 0.5,  y: canvas.height * 0.50, size: 26 },
                { x: canvas.width * 0.15, y: canvas.height * 0.75, size: 22 },
                { x: canvas.width * 0.85, y: canvas.height * 0.70, size: 28 }
            ];

            stars.forEach((star, index) => {
                ctx.save();
                ctx.translate(star.x, star.y);
                ctx.rotate(angle * (index % 2 === 0 ? 1 : -1) * 0.6);

                // Halo dourado radiante
                let gradient = ctx.createRadialGradient(0, 0, 2, 0, 0, star.size * 2.2);
                gradient.addColorStop(0, 'rgba(250, 204, 21, 0.95)');
                gradient.addColorStop(0.4, 'rgba(245, 158, 11, 0.45)');
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, star.size * 2.2, 0, Math.PI * 2);
                ctx.fill();

                // Núcleo brilhante da estrela
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, 0, star.size * 0.45, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });

            angle += 0.012;
            requestAnimationFrame(drawStarryNight);
        }

        drawStarryNight();

        // Funções da modal corrigidas e funcionando perfeitamente
        function openModal() {
            const modal = document.getElementById('secretModal');
            if (modal) modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('secretModal');
            if (modal) modal.style.display = 'none';
        }
    </script>

</body>
</html>
