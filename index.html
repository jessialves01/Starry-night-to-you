<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starry Night - Python Script 🌌</title>
    <style>
        body {
            background-color: #050b18;
            color: #4a90e2;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        .terminal-header {
            width: 100%;
            max-width: 600px;
            background: #101935;
            padding: 8px 12px;
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #1e2952;
            box-sizing: border-box;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }
        .title-bar {
            color: #8ab4f8;
            font-size: 0.85rem;
            margin-left: 10px;
        }
        .terminal-body {
            width: 100%;
            max-width: 600px;
            background: #090e1f;
            border: 1px solid #1e2952;
            border-top: none;
            border-radius: 0 0 8px 8px;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
        }
        .art-container {
            width: 100%;
            overflow: hidden;
            border-radius: 4px;
            background: #050b18;
            padding: 5px;
            position: relative;
        }
        /* Efeito visual imitando a arte em caracteres/código da foto */
        .ascii-art {
            font-size: 6px;
            line-height: 6px;
            letter-spacing: 0px;
            white-space: pre;
            color: #4a88e2;
            text-align: left;
            overflow-x: auto;
            max-height: 350px;
        }
        .ascii-art span {
            color: #f1c40f; /* Detalhes dourados das estrelas */
        }
        .code-load {
            font-size: 0.75rem;
            color: #3b82f6;
            text-align: left;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        .btn {
            background-color: #f1c40f;
            color: #050b18;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 20px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        
        /* Modal da mensagem secreta em inglês */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: #101935;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #f1c40f;
            max-width: 320px;
            text-align: center;
            color: #ffffff;
        }
        .modal-content p {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            font-family: 'Courier New', Courier, monospace;
        }
        .close-btn {
            background: #f1c40f;
            color: #050b18;
            border: none;
            padding: 8px 16px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="title-bar">starry_night.py - VS Code</span>
    </div>

    <div class="terminal-body">
        <div class="code-load" id="codeLog">Initializing script... loading pixels & matrix mapping...</div>
        
        <div class="art-container">
            <!-- Imagem estilizada da Noite Estrelada com tom de código/pixelado -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/800px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg" style="width: 100%; border-radius: 4px; filter: contrast(120%) brightness(90%) hue-rotate(10deg);" alt="Starry Night">
        </div>

        <button class="btn" onclick="openMessage()">Click for a surprise 🌠</button>
    </div>

    <!-- Mensagem Secreta -->
    <div id="secretModal" class="modal">
        <div class="modal-content">
            <p>They say stars shine brighter when you're around the right person... 💫<br><br>*(Compiled specially for you, Kris!)*</p>
            <button class="close-btn" onclick="closeMessage()">Close 💙</button>
        </div>
    </div>

    <script>
        // Pequena animação de texto simulando o terminal compilando
        const logs = [
            "Importing PIL and numpy...",
            "Mapping Van Gogh color spectrum...",
            "Rendering matrix and variables...",
            "Starry Night script executed successfully! ✨"
        ];
        let i = 0;
        setInterval(() => {
            if(i < logs.length) {
                document.getElementById('codeLog').innerText = logs[i];
                i++;
            }
        }, 1200);

        function openMessage() {
            document.getElementById('secretModal').style.display = 'flex';
        }
        function closeMessage() {
            document.getElementById('secretModal').style.display = 'none';
        }
    </script>

</body>
</html>
