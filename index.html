<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Starry Night for You 🌌</title>
    <style>
        /* Fundo azul-escuro profundo e elegante */
        body {
            background-color: #0b132b; 
            color: #ffffff;
            font-family: 'Georgia', serif; /* Fonte mais clássica e romântica */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        /* Container para a obra de arte */
        .art-container {
            width: 100%;
            max-width: 550px; /* Tamanho bom para celular */
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); /* Sombra elegante */
            border: 3px solid #f1c40f; /* Moldura dourada fina */
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }
        
        /* Efeito ao passar o mouse/tocar */
        .art-container:hover {
            transform: scale(1.02);
        }

        /* A imagem de Van Gogh */
        img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* A frase poética em inglês */
        .message {
            font-size: 1.4rem;
            line-height: 1.6;
            color: #f1c40f; /* Dourado suave para combinar com as estrelas */
            max-width: 450px;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); /* Sombra no texto */
        }
        
        /* Uma pequena assinatura fofa no final */
        .signature {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            margin-top: 40px;
            font-style: italic;
        }

    </style>
</head>
<body>

    <div class="art-container">
        <!-- Usando a imagem oficial e de alta qualidade do Wikimedia -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1280px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg" alt="Starry Night by Van Gogh">
    </div>

    <!-- A mensagem que você pediu em inglês -->
    <p class="message">
        May the stars light up your night.<br>
        Thinking of you 💫
    </p>

    <p class="signature">Compiled with 💙</p>

</body>
</html>
